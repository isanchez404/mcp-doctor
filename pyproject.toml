[project]
name = "mcp-doctor"
version = "0.1.0"
description = "Local-first diagnostics, tracing, and safety tooling for MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Isaac Sanchez" }
]
keywords = ["mcp", "model-context-protocol", "diagnostics", "agents", "hermes", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
mcp = [
  "mcp>=1.0.0"
]

[project.scripts]
mcp-doctor = "mcp_doctor.cli:app"

[project.urls]
Source = "https://github.com/isanchez404/mcp-doctor"
Issues = "https://github.com/isanchez404/mcp-doctor/issues"
Documentation = "https://github.com/isanchez404/mcp-doctor#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
